<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Master Challenge</title><style>body{font-family:system-ui;background:#101827;color:#f5f7fb;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#182338;padding:26px;border-radius:20px;margin:16px 0}button,input{padding:12px;border-radius:10px;font-size:16px}button{border:0;background:#7dd3fc;font-weight:800;margin:5px;cursor:pointer}.ans{display:block;width:100%;text-align:left;background:#202d46;color:white;border:1px solid #40516f}.good{background:#164b32}.bad{background:#5a2730}input{background:#0d1627;color:white;border:1px solid #526481;width:min(90%,420px)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #40516f;text-align:left}th{color:#7dd3fc}.hide{display:none}.muted{color:#b7c1d5}</style></head><body><div class="wrap"><h1>📚 Story Master Challenge</h1><div id="start" class="card"><h2>Ready to become a Story Master?</h2><p>Practice plot, conflict, protagonist, point of view, and setting.</p><input id="name" maxlength="40" placeholder="Enter your name or nickname"><p><button onclick="begin('Independent')">🏠 Independent Mode</button><button onclick="begin('Live')">🎮 Live Class Mode</button></p></div><div id="game" class="card hide"><div id="meta" class="muted"></div><h2 id="q"></h2><div id="answers"></div><p id="feedback"></p><button id="next" class="hide" onclick="next()">Next Challenge →</button></div><div id="result" class="card hide"></div><div class="card"><h2>🏆 Shared Class Leaderboard</h2><p id="cloud" class="muted">Connecting…</p><button onclick="board()">↻ Refresh</button> <a href="teacher.html"><button>👩‍🏫 Teacher Dashboard</button></a><table><thead><tr><th>#</th><th>Student</th><th>Score</th><th>Mode</th></tr></thead><tbody id="lb"></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const Q=[['Which part of a story introduces characters, setting, and the main problem?',['Exposition','Climax','Falling Action','Resolution'],0,'Exposition is the beginning where characters, setting, and the main problem are introduced.'],['Which part of the plot is the peak or turning point?',['Exposition','Rising Action','Climax','Resolution'],2,'The climax is the peak or turning point.'],['When the problem gets bigger, harder, and more complicated, which part is it?',['Resolution','Rising Action','Exposition','Falling Action'],1,'Rising action builds the problem through obstacles and suspense.'],['Which part deals with the results of the climax as tension cools down?',['Falling Action','Exposition','Rising Action','Climax'],0,'Falling action deals with the results of the climax.'],['What happens in the resolution?',['Problem is introduced','Problem gets harder','Story reaches its peak','Problem is wrapped up and a new normal begins'],3,'The resolution wraps up the problem and begins a new normal.'],['A character struggles with whether to tell the truth. What conflict is this?',['Person vs. Person','Person vs. Nature','Person vs. Self','Person vs. Technology'],2,'Person vs. Self is an internal conflict inside the character’s mind.'],['A character must survive a dangerous storm. What conflict is this?',['Person vs. Society','Person vs. Nature','Person vs. Technology','Person vs. Self'],1,'A storm creates Person vs. Nature conflict.'],['What is a protagonist?',['Every narrator','The main character whose problem or goal drives the story','The character who always causes conflict','The setting'],1,'The protagonist is the main character whose problem or goal drives the story.'],['Which POV commonly uses I, me, my, and we?',['First person','Second person','Third person','None'],0,'First person commonly uses I, me, my, and we.'],['Which POV addresses the reader directly?',['First person','Second person','Third person','Internal'],1,'Second person addresses the reader directly.'],['Which setting term answers “Where does the story take place?”',['Time','Place','Environment','Mood/Atmosphere'],1,'Place tells where the story takes place.'],['Which setting term answers “When does the story take place?”',['Place','Time','Environment','Mood/Atmosphere'],1,'Time tells when the story takes place.'],['Which setting term means the surroundings or conditions?',['Place','Time','Environment','Climax'],2,'Environment refers to the surroundings or conditions.'],['Which setting element describes the feeling created by the setting?',['Place','Time','Environment','Mood/Atmosphere'],3,'Mood/Atmosphere describes the feeling created by the setting.']];let client=supabase.createClient(STORY_MASTER_CONFIG.SUPABASE_URL,STORY_MASTER_CONFIG.SUPABASE_ANON_KEY),qs=[],i=0,score=0,mode='',student='';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function begin(m){student=name.value.trim();if(!student)return alert('Please enter your name or nickname.');mode=m;qs=[...Q].sort(()=>Math.random()-.5);start.classList.add('hide');game.classList.remove('hide');render()}function render(){let x=qs[i];meta.textContent=`Challenge ${i+1} of ${qs.length} • Score ${score}`;q.textContent=x[0];answers.innerHTML='';feedback.textContent='';next.classList.add('hide');x[1].forEach((a,n)=>{let b=document.createElement('button');b.className='ans';b.textContent=String.fromCharCode(65+n)+'. '+a;b.onclick=()=>pick(n,b);answers.appendChild(b)})}function pick(n,b){let x=qs[i];[...answers.children].forEach((z,k)=>{z.disabled=true;if(k===x[2])z.classList.add('good')});if(n===x[2]){score+=100;feedback.textContent='✅ Correct! '+x[3]}else{b.classList.add('bad');feedback.textContent='❌ Not quite. '+x[3]}next.classList.remove('hide')}function next(){if(++i<qs.length)render();else finish()}async function finish(){game.classList.add('hide');result.classList.remove('hide');result.innerHTML=`<h2>🏆 Challenge Complete!</h2><h1>${score} points</h1><p>${esc(student)}, you completed ${qs.length} challenges.</p><button onclick="location.reload()">Play Again</button>`;let r=await client.from('story_master_scores').insert({class_id:STORY_MASTER_CONFIG.CLASS_ID,student_name:student,score,mode});if(r.error)result.innerHTML+='<p>⚠ Score could not be uploaded. Tell your teacher.</p>';else result.innerHTML+='<p>✓ Score added to the shared leaderboard.</p>';board()}async function board(){let r=await client.from('story_master_scores').select('student_name,score,mode').eq('class_id',STORY_MASTER_CONFIG.CLASS_ID).order('score',{ascending:false}).limit(20);lb.innerHTML='';if(r.error){cloud.textContent='Could not connect: '+r.error.message;return}cloud.textContent='✓ Connected to class '+STORY_MASTER_CONFIG.CLASS_ID;(r.data||[]).forEach((x,n)=>lb.innerHTML+=`<tr><td>${n+1}</td><td>${esc(x.student_name)}</td><td>${x.score}</td><td>${esc(x.mode)}</td></tr>`);if(!r.data?.length)lb.innerHTML='<tr><td colspan="4">No scores yet.</td></tr>'}board()</script></body></html>
