<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Master Challenge</title>
<style>body{font-family:Arial,sans-serif;background:#101827;color:#f5f7fb;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#182338;padding:26px;border-radius:20px;margin:16px 0}button,input{padding:12px;border-radius:10px;font-size:16px}button{border:0;background:#7dd3fc;font-weight:bold;margin:5px;cursor:pointer}.ans{display:block;width:100%;text-align:left;background:#202d46;color:white;border:1px solid #40516f}.good{background:#164b32}.bad{background:#5a2730}.hide{display:none}input{background:#0d1627;color:white;border:1px solid #526481;width:min(90%,420px)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #40516f;text-align:left}th{color:#7dd3fc}.muted{color:#b7c1d5}</style></head>
<body><div class="wrap"><h1>📚 Story Master Challenge</h1>
<div id="start" class="card"><h2>Ready to become a Story Master?</h2><p>Practice plot, conflict, protagonist, point of view, and setting.</p><input id="studentName" maxlength="40" placeholder="Enter your name or nickname"><p><button type="button" onclick="startGame('Independent')">🏠 Independent Mode</button><button type="button" onclick="startGame('Live')">🎮 Live Class Mode</button></p></div>
<div id="game" class="card hide"><div id="meta" class="muted"></div><h2 id="question"></h2><div id="answers"></div><p id="feedback"></p><button id="nextBtn" class="hide" type="button" onclick="nextQuestion()">Next Challenge →</button></div>
<div id="result" class="card hide"></div>
<div class="card"><h2>🏆 Shared Class Leaderboard</h2><p id="cloud" class="muted">Leaderboard will connect separately from the game.</p><button type="button" onclick="loadBoard()">↻ Refresh Leaderboard</button><a href="teacher.html"><button type="button">👩‍🏫 Teacher Dashboard</button></a><table><thead><tr><th>#</th><th>Student</th><th>Score</th><th>Mode</th></tr></thead><tbody id="lb"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></div>
<script src="config.js"></script>
<script>
var QUESTIONS=[
["Which part of a story introduces characters, setting, and the main problem?",["Exposition","Climax","Falling Action","Resolution"],0,"Exposition is the beginning where characters, setting, and the main problem are introduced."],
["Which part of the plot is the peak or turning point?",["Exposition","Rising Action","Climax","Resolution"],2,"The climax is the peak or turning point."],
["When the problem gets bigger, harder, and more complicated, which part is it?",["Resolution","Rising Action","Exposition","Falling Action"],1,"Rising action builds the problem through obstacles and suspense."],
["Which part deals with the results of the climax as tension cools down?",["Falling Action","Exposition","Rising Action","Climax"],0,"Falling action deals with the results of the climax."],
["What happens in the resolution?",["Problem is introduced","Problem gets harder","Story reaches its peak","Problem is wrapped up and a new normal begins"],3,"The resolution wraps up the problem and begins a new normal."],
["A character struggles with whether to tell the truth. What conflict is this?",["Person vs. Person","Person vs. Nature","Person vs. Self","Person vs. Technology"],2,"Person vs. Self is an internal conflict."],
["A character must survive a dangerous storm. What conflict is this?",["Person vs. Society","Person vs. Nature","Person vs. Technology","Person vs. Self"],1,"A storm creates Person vs. Nature conflict."],
["What is a protagonist?",["Every narrator","The main character whose problem or goal drives the story","The character who always causes conflict","The setting"],1,"The protagonist is the main character whose problem or goal drives the story."],
["Which POV commonly uses I, me, my, and we?",["First person","Second person","Third person","None"],0,"First person commonly uses I, me, my, and we."],
["Which POV addresses the reader directly?",["First person","Second person","Third person","Internal"],1,"Second person addresses the reader directly."],
["Which setting term answers Where does the story take place?",["Time","Place","Environment","Mood/Atmosphere"],1,"Place tells where the story takes place."],
["Which setting term answers When does the story take place?",["Place","Time","Environment","Mood/Atmosphere"],1,"Time tells when the story takes place."],
["Which setting term means the surroundings or conditions?",["Place","Time","Environment","Climax"],2,"Environment refers to the surroundings or conditions."],
["Which setting element describes the feeling created by the setting?",["Place","Time","Environment","Mood/Atmosphere"],3,"Mood/Atmosphere describes the feeling created by the setting."]];
var qs=[],pos=0,score=0,playMode="",student="";
function byId(id){return document.getElementById(id)}
function startGame(m){student=byId("studentName").value.trim();if(!student){alert("Please enter your name or nickname first.");return;}playMode=m;qs=QUESTIONS.slice().sort(function(){return Math.random()-.5});pos=0;score=0;byId("start").className="card hide";byId("game").className="card";showQuestion();}
function showQuestion(){var x=qs[pos];byId("meta").textContent="Challenge "+(pos+1)+" of "+qs.length+" • Score "+score;byId("question").textContent=x[0];byId("answers").innerHTML="";byId("feedback").textContent="";byId("nextBtn").className="hide";for(var n=0;n<x[1].length;n++){(function(k){var b=document.createElement("button");b.type="button";b.className="ans";b.textContent=String.fromCharCode(65+k)+". "+x[1][k];b.onclick=function(){answer(k,b)};byId("answers").appendChild(b)})(n)}}
function answer(n,b){var x=qs[pos],kids=byId("answers").children;for(var k=0;k<kids.length;k++){kids[k].disabled=true;if(k===x[2])kids[k].className="ans good"}if(n===x[2]){score+=100;byId("feedback").textContent="✅ Correct! "+x[3]}else{b.className="ans bad";byId("feedback").textContent="❌ Not quite. "+x[3]}byId("nextBtn").className="";}
function nextQuestion(){pos++;if(pos<qs.length)showQuestion();else finishGame();}
function finishGame(){byId("game").className="card hide";byId("result").className="card";byId("result").innerHTML="<h2>🏆 Challenge Complete!</h2><h1>"+score+" points</h1><p>"+student.replace(/</g,"&lt;")+", you completed "+qs.length+" challenges.</p><button type='button' onclick='location.reload()'>Play Again</button><p id='uploadStatus'>Saving score…</p>";saveScore();}
function getSupabase(){if(!window.supabase||!window.STORY_MASTER_CONFIG)return null;return window.supabase.createClient(window.STORY_MASTER_CONFIG.SUPABASE_URL,window.STORY_MASTER_CONFIG.SUPABASE_ANON_KEY)}
function saveScore(){var c=getSupabase();if(!c){byId("uploadStatus").textContent="The game worked, but the leaderboard service has not loaded.";return;}c.from("story_master_scores").insert({class_id:STORY_MASTER_CONFIG.CLASS_ID,student_name:student,score:score,mode:playMode}).then(function(r){byId("uploadStatus").textContent=r.error?"Score could not be uploaded. Tell your teacher.":"✓ Score added to the shared leaderboard.";loadBoard();});}
function loadBoard(){var c=getSupabase();if(!c){byId("cloud").textContent="Game is ready. Leaderboard is connecting…";return;}c.from("story_master_scores").select("student_name,score,mode").eq("class_id",STORY_MASTER_CONFIG.CLASS_ID).order("score",{ascending:false}).limit(20).then(function(r){if(r.error){byId("cloud").textContent="Could not connect to leaderboard.";return;}byId("cloud").textContent="✓ Connected to class "+STORY_MASTER_CONFIG.CLASS_ID;var h="";for(var n=0;n<r.data.length;n++){h+="<tr><td>"+(n+1)+"</td><td>"+String(r.data[n].student_name).replace(/</g,"&lt;")+"</td><td>"+r.data[n].score+"</td><td>"+r.data[n].mode+"</td></tr>"}byId("lb").innerHTML=h||"<tr><td colspan='4'>No scores yet.</td></tr>";});}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="loadBoard()" onerror="document.getElementById('cloud').textContent='Game is ready; leaderboard service is temporarily unavailable.'"></script>
</body></html>
