<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Master Live Host</title><style>body{font-family:system-ui;background:#101827;color:#f5f7fb;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#182338;padding:26px;border-radius:20px;margin:16px 0}button{padding:12px 16px;border:0;border-radius:10px;background:#7dd3fc;font-weight:800;margin:5px;cursor:pointer}.muted{color:#b7c1d5}.code{font-size:3rem;font-weight:900;letter-spacing:.15em;color:#7dd3fc}.hide{display:none}.pill{display:inline-block;background:#24334f;padding:8px 12px;border-radius:999px;margin:4px}</style></head><body><div class="wrap"><h1>👩‍🏫 Story Master Live — Host</h1><div class="card" id="setup"><h2>Start a live class game</h2><p>This creates a game code. Students use the regular Story Master link, choose <b>Live Class</b>, and enter the code.</p><button onclick="createGame()">Create Game</button> <a href="teacher.html"><button>Score Dashboard</button></a></div><div class="card hide" id="lobby"><h2>Game Code</h2><div class="code" id="code"></div><p class="muted">Waiting for students…</p><div id="players"></div><p><button onclick="startLive()">▶ Start Game</button> <button onclick="refreshPlayers()">↻ Refresh Players</button></p></div><div class="card hide" id="control"><div id="progress" class="muted"></div><h2 id="q"></h2><div id="choices"></div><p id="answered"></p><button id="next" onclick="advance()">Next Question →</button></div><div class="card hide" id="done"><h2>🏆 Live game complete</h2><p>Students' final scores are being saved to the regular teacher dashboard.</p><a href="teacher.html"><button>Open Score Dashboard</button></a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const QUESTIONS=[
['Which part of a story introduces characters, setting, and the main problem?',['Exposition','Climax','Falling Action','Resolution']],
['Which part of the plot is the peak or turning point?',['Exposition','Rising Action','Climax','Resolution']],
['When the problem gets bigger, harder, and more complicated, which part is it?',['Resolution','Rising Action','Exposition','Falling Action']],
['Which part deals with the results of the climax as tension cools down?',['Falling Action','Exposition','Rising Action','Climax']],
['What happens in the resolution?',['Problem is introduced','Problem gets harder','Story reaches its peak','Problem is wrapped up and a new normal begins']],
['A character struggles with whether to tell the truth. What conflict is this?',['Person vs. Person','Person vs. Nature','Person vs. Self','Person vs. Technology']],
['A character must survive a dangerous storm. What conflict is this?',['Person vs. Society','Person vs. Nature','Person vs. Technology','Person vs. Self']],
['What is a protagonist?',['Every narrator','The main character whose problem or goal drives the story','The character who always causes conflict','The setting']],
['Which POV commonly uses I, me, my, and we?',['First person','Second person','Third person','None']],
['Which POV addresses the reader directly?',['First person','Second person','Third person','Internal']],
['Which setting term answers “Where does the story take place?”',['Time','Place','Environment','Mood/Atmosphere']],
['Which setting term answers “When does the story take place?”',['Place','Time','Environment','Mood/Atmosphere']],
['Which setting term means the surroundings or conditions?',['Place','Time','Environment','Climax']],
['Which setting element describes the feeling created by the setting?',['Place','Time','Environment','Mood/Atmosphere']]];
const client=supabase.createClient(STORY_MASTER_CONFIG.SUPABASE_URL,STORY_MASTER_CONFIG.SUPABASE_ANON_KEY);let gameCode='',idx=-1,timer=null;
function id(x){return document.getElementById(x)}function makeCode(){return String(Math.floor(1000+Math.random()*9000))}
async function createGame(){gameCode=makeCode();id('code').textContent=gameCode;id('setup').className='card hide';id('lobby').className='card';await client.from('story_master_scores').insert({class_id:STORY_MASTER_CONFIG.CLASS_ID,student_name:'LOBBY',score:-2,mode:'__HOST__'+gameCode});refreshPlayers();timer=setInterval(()=>{refreshPlayers();if(idx>=0)refreshAnswers()},2500)}
async function refreshPlayers(){let r=await client.from('story_master_scores').select('student_name').eq('class_id',STORY_MASTER_CONFIG.CLASS_ID).eq('mode','__JOIN__'+gameCode);let names=[...new Set((r.data||[]).map(x=>x.student_name))];id('players').innerHTML=names.length?names.map(n=>'<span class="pill">'+esc(n)+'</span>').join(''):'<span class="muted">No students joined yet.</span>'}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function startLive(){idx=0;id('lobby').className='card hide';id('control').className='card';await publish();show()}
async function publish(){await client.from('story_master_scores').insert({class_id:STORY_MASTER_CONFIG.CLASS_ID,student_name:'CONTROL',score:idx,mode:'__HOST__'+gameCode})}
function show(){let x=QUESTIONS[idx];id('progress').textContent='Question '+(idx+1)+' of '+QUESTIONS.length+' • Code '+gameCode;id('q').textContent=x[0];id('choices').innerHTML=x[1].map((a,i)=>'<p><b>'+String.fromCharCode(65+i)+'.</b> '+esc(a)+'</p>').join('');id('answered').textContent='Waiting for answers…';id('next').textContent=idx===QUESTIONS.length-1?'Finish Game':'Next Question →';refreshAnswers()}
async function refreshAnswers(){if(idx<0)return;let r=await client.from('story_master_scores').select('student_name').eq('class_id',STORY_MASTER_CONFIG.CLASS_ID).eq('mode','__ANSWER__'+gameCode+':'+idx);let n=new Set((r.data||[]).map(x=>x.student_name)).size;id('answered').textContent=n+' student'+(n===1?' has':'s have')+' answered.'}
async function advance(){if(idx===QUESTIONS.length-1){idx=-1;await client.from('story_master_scores').insert({class_id:STORY_MASTER_CONFIG.CLASS_ID,student_name:'END',score:-1,mode:'__HOST__'+gameCode});clearInterval(timer);id('control').className='card hide';id('done').className='card';return}idx++;await publish();show()}
</script></body></html>
