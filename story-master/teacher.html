<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Master Teacher Dashboard</title><style>body{font-family:system-ui;background:#101827;color:#f5f7fb;margin:0;padding:24px}.card{max-width:950px;margin:auto;background:#182338;padding:28px;border-radius:20px}button{padding:10px 14px;border:0;border-radius:10px;font-weight:700;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #40516f;text-align:left}th{color:#7dd3fc}a{color:#7dd3fc}</style></head><body><div class="card"><h1>👩‍🏫 Story Master Teacher Dashboard</h1><p id="status">Connecting…</p><button onclick="load()">↻ Refresh</button><button onclick="csv()">⬇ Download CSV</button> <a href="index.html">Open student game</a><table><thead><tr><th>#</th><th>Student</th><th>Score</th><th>Mode</th><th>Date/Time</th></tr></thead><tbody id="body"></tbody></table></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>let rows=[],client=supabase.createClient(STORY_MASTER_CONFIG.SUPABASE_URL,STORY_MASTER_CONFIG.SUPABASE_ANON_KEY);function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){let q=await client.from('story_master_scores').select('student_name,score,mode,played_at').eq('class_id',STORY_MASTER_CONFIG.CLASS_ID).order('score',{ascending:false}).limit(500);let b=document.getElementById('body');b.innerHTML='';if(q.error){status.textContent='Error: '+q.error.message;return}rows=q.data||[];status.textContent='✓ Connected — '+rows.length+' scores for '+STORY_MASTER_CONFIG.CLASS_ID;rows.forEach((r,i)=>b.innerHTML+=`<tr><td>${i+1}</td><td>${e(r.student_name)}</td><td>${r.score}</td><td>${e(r.mode)}</td><td>${new Date(r.played_at).toLocaleString()}</td></tr>`);if(!rows.length)b.innerHTML='<tr><td colspan="5">No scores yet.</td></tr>'}function csv(){if(!rows.length)return alert('No scores to download yet.');let a=[['Rank','Student','Score','Mode','Date'],...rows.map((r,i)=>[i+1,r.student_name,r.score,r.mode,new Date(r.played_at).toLocaleString()])];let t=a.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='story-master-scores.csv';x.click()}load()</script></body></html>
